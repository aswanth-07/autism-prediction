[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd-screening-ml"
version = "1.0.0"
description = "Reproducible classical machine-learning study for adult ASD screening research."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "A Aswanth Raj" }]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.32,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]
legacy = [
  "imbalanced-learn>=0.12,<1",
  "jupyterlab>=4,<5",
  "seaborn>=0.13,<1",
  "xgboost>=2,<4",
]

[project.scripts]
asd-train = "asd_screening.training:main"
asd-export-web = "asd_screening.web_export:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=asd_screening --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["asd_screening"]

[[tool.mypy.overrides]]
module = ["joblib.*", "matplotlib.*", "pandas.*", "sklearn.*"]
ignore_missing_imports = true
